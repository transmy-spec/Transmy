name: Quality

on:
  push:
    branches: [master, newest]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  production-compose:
    runs-on: ubuntu-latest
    env:
      APP_DATABASE_PASSWORD: synthetic-ci-app-password
      KEYCLOAK_DATABASE_PASSWORD: synthetic-ci-keycloak-password
      KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD: synthetic-ci-bootstrap-password
      OIDC_CLIENT_SECRET: synthetic-ci-oidc-secret
      SESSION_SECRET: synthetic-ci-session-secret
      APP_DOMAIN: ci.transmy.invalid
      APP_PUBLIC_URL: https://ci.transmy.invalid
      ACME_EMAIL: ci@transmy.invalid
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f compose.yaml -f compose.production.yaml config --quiet

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      APP_DATABASE_PASSWORD: synthetic-ci-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: mypy app
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run test:run
      - run: npm run build
