services:
  caddy:
    volumes:
      - ${CADDY_CONFIG_FILE:-./infrastructure/caddy/Caddyfile.production}:/etc/caddy/Caddyfile:ro
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN for production}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL for production}
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    image: transmissions-frontend:production
    build:
      target: production
      args:
        VITE_DEFAULT_LOCALE: ${VITE_DEFAULT_LOCALE:-fr}
    read_only: true
    tmpfs:
      - /var/cache/nginx:uid=101,gid=101,mode=0750
      - /var/run:uid=101,gid=101,mode=0750
      - /tmp:uid=101,gid=101,mode=0750
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/health"]

  api:
    image: transmissions-api:production
    build:
      target: production
    read_only: true
    tmpfs:
      - /tmp:uid=10001,gid=10001,mode=0700
    cap_drop: [ALL]

  migrate:
    image: transmissions-migrate:production
    build:
      target: production
    read_only: true
    tmpfs:
      - /tmp:uid=10001,gid=10001,mode=0700
    cap_drop: [ALL]

  keycloak:
    command:
      - |
        case "$$APP_PUBLIC_URL" in
          */) echo >&2 "APP_PUBLIC_URL must not have a trailing slash"; exit 64 ;;
        esac
        exec /opt/keycloak/bin/kc.sh start --http-enabled=true --http-relative-path=/oidc --health-enabled=true --import-realm

    environment:
      KC_HOSTNAME: https://${APP_DOMAIN:?Set APP_DOMAIN for production}/oidc

  operations-check:
    image: transmissions-operations-check:production
    build: ./infrastructure/backup
    profiles: ["operations"]
    command: ["/usr/local/bin/operations-check.sh"]
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN for production}
      BACKUP_MAX_AGE_HOURS: ${BACKUP_MAX_AGE_HOURS:-26}
      RESTORE_MAX_AGE_HOURS: ${RESTORE_MAX_AGE_HOURS:-744}
      OPERATIONS_TLS_INSECURE: ${OPERATIONS_TLS_INSECURE:-false}
    volumes:
      - encrypted_backups:/backups:ro
    networks:
      - web_internal
    depends_on:
      caddy:
        condition: service_healthy
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
