name: transmissions

services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - public
      - web_internal
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

  frontend:
    build:
      context: ./frontend
      target: development
      args:
        VITE_DEFAULT_LOCALE: ${VITE_DEFAULT_LOCALE:-fr}
    environment:
      VITE_DEFAULT_LOCALE: ${VITE_DEFAULT_LOCALE:-fr}
    restart: unless-stopped
    networks:
      - web_internal
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:5173/"]
      interval: 10s
      timeout: 3s
      retries: 10
    security_opt:
      - no-new-privileges:true

  api:
    build:
      context: ./backend
      target: development
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-https://localhost}
      APP_LOG_LEVEL: ${APP_LOG_LEVEL:-INFO}
      APP_DATABASE_HOST: postgres-app
      APP_DATABASE_PORT: "5432"
      APP_DATABASE_NAME: ${APP_DATABASE_NAME:-transmissions}
      APP_DATABASE_USER: ${APP_DATABASE_USER:-transmissions_app}
      APP_DATABASE_PASSWORD: ${APP_DATABASE_PASSWORD:?Set APP_DATABASE_PASSWORD in .env}
      APP_OIDC_ISSUER: ${APP_PUBLIC_URL:-https://localhost}/oidc/realms/transmissions
      APP_OIDC_AUTHORIZATION_URL: ${APP_PUBLIC_URL:-https://localhost}/oidc/realms/transmissions/protocol/openid-connect/auth
      APP_OIDC_TOKEN_URL: http://keycloak:8080/oidc/realms/transmissions/protocol/openid-connect/token
      APP_OIDC_JWKS_URL: http://keycloak:8080/oidc/realms/transmissions/protocol/openid-connect/certs
      APP_OIDC_END_SESSION_URL: ${APP_PUBLIC_URL:-https://localhost}/oidc/realms/transmissions/protocol/openid-connect/logout
      APP_OIDC_CLIENT_ID: transmissions-web
      APP_OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?Set OIDC_CLIENT_SECRET in .env}
      APP_KEYCLOAK_PROVISIONING_CLIENT_SECRET: ${KEYCLOAK_PROVISIONING_CLIENT_SECRET:-local-provisioning-client-secret-2026}
      APP_SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      APP_FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:-local-development-field-encryption-key-2026}
      APP_CLAMAV_HOST: clamav
      APP_CLAMAV_PORT: "3310"
      APP_INTEGRATION_ALLOWED_HOSTS: ${INTEGRATION_ALLOWED_HOSTS:-host.docker.internal}
    networks:
      - web_internal
      - app_data
    depends_on:
      postgres-app:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      clamav:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "app.healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 10
    security_opt:
      - no-new-privileges:true

  clamav:
    image: clamav/clamav:1.4
    restart: unless-stopped
    networks:
      - app_data
    healthcheck:
      test: ["CMD", "/usr/local/bin/clamdcheck.sh"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 90s
    security_opt:
      - no-new-privileges:true

  migrate:
    build:
      context: ./backend
      target: development
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-https://localhost}
      APP_DATABASE_HOST: postgres-app
      APP_DATABASE_PORT: "5432"
      APP_DATABASE_NAME: ${APP_DATABASE_NAME:-transmissions}
      APP_DATABASE_USER: ${APP_DATABASE_USER:-transmissions_app}
      APP_DATABASE_PASSWORD: ${APP_DATABASE_PASSWORD:?Set APP_DATABASE_PASSWORD in .env}
      APP_OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?Set OIDC_CLIENT_SECRET in .env}
      APP_SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      APP_FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:-local-development-field-encryption-key-2026}
    networks:
      - app_data
    depends_on:
      postgres-app:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

  postgres-app:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${APP_DATABASE_NAME:-transmissions}
      POSTGRES_USER: ${APP_DATABASE_USER:-transmissions_app}
      POSTGRES_PASSWORD: ${APP_DATABASE_PASSWORD:?Set APP_DATABASE_PASSWORD in .env}
    volumes:
      - postgres_app_data:/var/lib/postgresql/data
    networks:
      - app_data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt:
      - no-new-privileges:true

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0
    command:
      - start-dev
      - --http-relative-path=/oidc
      - --health-enabled=true
      - --import-realm
    restart: unless-stopped
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: postgres-keycloak
      KC_DB_URL_PORT: "5432"
      KC_DB_URL_DATABASE: ${KEYCLOAK_DATABASE_NAME:-keycloak}
      KC_DB_USERNAME: ${KEYCLOAK_DATABASE_USER:-keycloak_app}
      KC_DB_PASSWORD: ${KEYCLOAK_DATABASE_PASSWORD:?Set KEYCLOAK_DATABASE_PASSWORD in .env}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME:-local-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD:?Set KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD in .env}
      TRANSMY_PROVISIONING_CLIENT_SECRET: ${KEYCLOAK_PROVISIONING_CLIENT_SECRET:-}
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME: ${APP_PUBLIC_URL:-https://localhost}/oidc
      KC_HTTP_ENABLED: "true"
    volumes:
      - ${KEYCLOAK_REALM_FILE:-./infrastructure/keycloak/transmissions-realm.json}:/opt/keycloak/data/import/transmissions-realm.json:ro
    networks:
      - web_internal
      - identity_data
    depends_on:
      postgres-keycloak:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -c "exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /oidc/health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '200 OK' <&3"
      interval: 10s
      timeout: 5s
      retries: 20
    security_opt:
      - no-new-privileges:true

  postgres-keycloak:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${KEYCLOAK_DATABASE_NAME:-keycloak}
      POSTGRES_USER: ${KEYCLOAK_DATABASE_USER:-keycloak_app}
      POSTGRES_PASSWORD: ${KEYCLOAK_DATABASE_PASSWORD:?Set KEYCLOAK_DATABASE_PASSWORD in .env}
    volumes:
      - postgres_keycloak_data:/var/lib/postgresql/data
    networks:
      - identity_data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt:
      - no-new-privileges:true

  backup:
    profiles: ["operations"]
    build: ./infrastructure/backup
    command: ["/usr/local/bin/backup.sh"]
    environment: &backup-environment
      APP_DATABASE_NAME: ${APP_DATABASE_NAME:-transmissions}
      APP_DATABASE_USER: ${APP_DATABASE_USER:-transmissions_app}
      APP_DATABASE_PASSWORD: ${APP_DATABASE_PASSWORD:?Set APP_DATABASE_PASSWORD in .env}
      KEYCLOAK_DATABASE_NAME: ${KEYCLOAK_DATABASE_NAME:-keycloak}
      KEYCLOAK_DATABASE_USER: ${KEYCLOAK_DATABASE_USER:-keycloak_app}
      KEYCLOAK_DATABASE_PASSWORD: ${KEYCLOAK_DATABASE_PASSWORD:?Set KEYCLOAK_DATABASE_PASSWORD in .env}
      BACKUP_ENCRYPTION_PASSWORD: ${BACKUP_ENCRYPTION_PASSWORD:-local-development-backup-key}
      BACKUP_RETENTION_COUNT: ${BACKUP_RETENTION_COUNT:-14}
    volumes:
      - encrypted_backups:/backups
    networks:
      - app_data
      - identity_data
    security_opt:
      - no-new-privileges:true

  restore-test:
    profiles: ["operations"]
    build: ./infrastructure/backup
    command: ["/usr/local/bin/restore-test.sh"]
    environment: *backup-environment
    volumes:
      - encrypted_backups:/backups
    networks:
      - app_data
      - identity_data
    security_opt:
      - no-new-privileges:true

  load-test:
    profiles: ["validation"]
    image: grafana/k6:0.57.0
    command: ["run", "--insecure-skip-tls-verify", "/audit/load-test.js"]
    environment:
      BASE_URL: https://localhost
      LOAD_VUS: ${LOAD_VUS:-10}
      LOAD_DURATION: ${LOAD_DURATION:-30s}
    volumes:
      - ./infrastructure/audit:/audit:ro
    network_mode: "service:caddy"
    security_opt:
      - no-new-privileges:true

  security-audit:
    profiles: ["validation"]
    image: curlimages/curl:8.16.0
    entrypoint: ["/bin/sh"]
    command: ["/audit/security-smoke.sh"]
    environment:
      BASE_URL: https://localhost
    volumes:
      - ./infrastructure/audit:/audit:ro
    network_mode: "service:caddy"
    security_opt:
      - no-new-privileges:true

networks:
  public:
  web_internal:
    internal: true
  app_data:
    internal: true
  identity_data:
    internal: true

volumes:
  caddy_data:
  caddy_config:
  postgres_app_data:
  postgres_keycloak_data:
  encrypted_backups:
